# This snippet must only be included from the HTTPS server block.
add_header Strict-Transport-Security "max-age=31536000" always;

location = /photos-of-the-year {
    return 301 /photos-of-the-year/;
}

location ^~ /photos-of-the-year/api/ {
    proxy_pass http://127.0.0.1:5002/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 10M;
}

location ^~ /photos-of-the-year/uploads/ {
    proxy_pass http://127.0.0.1:5002/uploads/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location ^~ /photos-of-the-year/assets/ {
    alias /usr/share/nginx/html/photos-of-the-year/backend/app/static/dist/assets/;
    expires 1y;
    add_header Cache-Control public;
    add_header Strict-Transport-Security "max-age=31536000" always;
    gzip on;
}

location ~* ^/photos-of-the-year/.*(?:/\.git/|\.env$|\.py$|requirements\.txt$) {
    deny all;
}

location /photos-of-the-year/ {
    alias /usr/share/nginx/html/photos-of-the-year/backend/app/static/dist/;
    try_files $uri $uri/ /photos-of-the-year/index.html;
}
